<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <radialGradient id="bg" cx="0.75" cy="0.5" r="0.8">
      <stop offset="0" stop-color="#1a0b3d"/>
      <stop offset="1" stop-color="#03030a"/>
    </radialGradient>
    <pattern id="hex" width="28" height="48.5" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
      <path d="M14 0 L28 8.08 V24.25 L14 32.33 L0 24.25 V8.08 Z M14 32.33 V48.5" fill="none" stroke="#7b5cff" stroke-opacity="0.09"/>
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 900 62px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 3px; }
    .sub  { font: 700 16px 'Courier New', Consolas, monospace; letter-spacing: 3px; fill: #c9b8ff; }
    .tag  { font: 700 13px 'Courier New', Consolas, monospace; letter-spacing: 1px; }
    .flicker { animation: fl 6s infinite; }
    @keyframes fl { 0%,18%,22%,25%,53%,57%,100% { opacity: 1 } 20%,24%,55% { opacity: .35 } }
    .node { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.35); opacity: 1 } }
    .edge { stroke: #7b5cff; stroke-opacity: .28; stroke-width: 1.2; fill: none; }
  </style>

  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#hex)"/>

  <!-- neural network (right side) -->
  <g>
    <!-- edges layer 1 -> 2 -->
    <path id="e1" class="edge" d="M640 80 L780 60"/>
    <path id="e2" class="edge" d="M640 80 L780 150"/>
    <path id="e3" class="edge" d="M640 150 L780 60"/>
    <path id="e4" class="edge" d="M640 150 L780 150"/>
    <path id="e5" class="edge" d="M640 150 L780 240"/>
    <path id="e6" class="edge" d="M640 220 L780 150"/>
    <path id="e7" class="edge" d="M640 220 L780 240"/>
    <path class="edge" d="M640 80 L780 240"/>
    <path class="edge" d="M640 220 L780 60"/>
    <!-- edges layer 2 -> 3 -->
    <path id="f1" class="edge" d="M780 60 L910 110"/>
    <path id="f2" class="edge" d="M780 150 L910 110"/>
    <path id="f3" class="edge" d="M780 150 L910 190"/>
    <path id="f4" class="edge" d="M780 240 L910 190"/>
    <path class="edge" d="M780 60 L910 190"/>
    <path class="edge" d="M780 240 L910 110"/>

    <!-- signals travelling along edges -->
    <g filter="url(#glow)">
      <circle r="3" fill="#00f0ff"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
      <circle r="3" fill="#ff2bd6"><animateMotion dur="2.2s" begin="0.4s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
      <circle r="3" fill="#00f0ff"><animateMotion dur="2s" begin="0.9s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
      <circle r="3" fill="#ff2bd6"><animateMotion dur="1.6s" begin="0.2s" repeatCount="indefinite"><mpath href="#e6"/></animateMotion></circle>
      <circle r="3" fill="#b6ff3b"><animateMotion dur="2.4s" begin="1.1s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
      <circle r="3" fill="#00f0ff"><animateMotion dur="1.7s" begin="0.6s" repeatCount="indefinite"><mpath href="#f2"/></animateMotion></circle>
      <circle r="3" fill="#ff2bd6"><animateMotion dur="1.9s" begin="1.3s" repeatCount="indefinite"><mpath href="#f4"/></animateMotion></circle>
      <circle r="3" fill="#b6ff3b"><animateMotion dur="2.1s" begin="0.1s" repeatCount="indefinite"><mpath href="#f1"/></animateMotion></circle>
      <circle r="3" fill="#00f0ff"><animateMotion dur="2.3s" begin="0.8s" repeatCount="indefinite"><mpath href="#f3"/></animateMotion></circle>
    </g>

    <!-- nodes -->
    <g filter="url(#glow)">
      <circle class="node" cx="640" cy="80"  r="7" fill="#00f0ff"/>
      <circle class="node" cx="640" cy="150" r="7" fill="#00f0ff" style="animation-delay:.4s"/>
      <circle class="node" cx="640" cy="220" r="7" fill="#00f0ff" style="animation-delay:.8s"/>
      <circle class="node" cx="780" cy="60"  r="8" fill="#ff2bd6" style="animation-delay:.2s"/>
      <circle class="node" cx="780" cy="150" r="8" fill="#ff2bd6" style="animation-delay:.6s"/>
      <circle class="node" cx="780" cy="240" r="8" fill="#ff2bd6" style="animation-delay:1s"/>
      <circle class="node" cx="910" cy="110" r="9" fill="#b6ff3b" style="animation-delay:.3s"/>
      <circle class="node" cx="910" cy="190" r="9" fill="#b6ff3b" style="animation-delay:.9s"/>
    </g>
    <text class="tag" x="612" y="275" fill="#00f0ff" fill-opacity=".8">DATA</text>
    <text class="tag" x="752" y="275" fill="#ff2bd6" fill-opacity=".8">AI</text>
    <text class="tag" x="868" y="275" fill="#b6ff3b" fill-opacity=".8">AUTOMATION</text>
  </g>

  <!-- name -->
  <g class="flicker">
    <text class="name" x="50" y="135" fill="url(#nameGrad)" filter="url(#glow)" opacity=".55">HUGO</text>
    <text class="name" x="50" y="135" fill="url(#nameGrad)">HUGO</text>
  </g>
  <text class="name" x="50" y="200" fill="#f3eeff" filter="url(#glow)">ROSALES</text>
  <text class="sub" x="54" y="240">&gt; AI SOLUTIONS · AUTOMATION · DATA &amp; BI</text>
  <text class="sub" x="54" y="262" fill-opacity=".7" style="fill:#8f7fd1">&gt; COMPUTER ENGINEER · BARCELONA</text>
  <rect x="54" y="248" width="10" height="2" fill="#00f0ff">
    <animate attributeName="width" values="0;410;410;0" keyTimes="0;.35;.85;1" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
