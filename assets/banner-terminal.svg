<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity="0.35"/></pattern>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#00f0ff" stroke-opacity="0.06"/></pattern>
<filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0.12"/></linearGradient>
</defs>
<style>
.mono{font-family:'Courier New',Consolas,monospace;font-weight:700}
.lbl{font:700 12px 'Courier New',Consolas,monospace;letter-spacing:2px}
.blink{animation:bl 1.2s steps(1) infinite} @keyframes bl{50%{opacity:0}}
.bar{animation:eq 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.spin{animation:sp 4s linear infinite;transform-origin:880px 205px} @keyframes sp{to{transform:rotate(360deg)}}
</style>
<rect width="1000" height="300" fill="#04060c"/>
<rect width="1000" height="300" fill="url(#grid)"/>
<!-- window -->
<rect x="20" y="20" width="960" height="260" rx="6" fill="#070b16" fill-opacity="0.85" stroke="#00f0ff" stroke-opacity="0.35"/>
<rect x="20" y="20" width="960" height="34" rx="6" fill="#0c1324"/>
<circle cx="42" cy="37" r="6" fill="#ff2bd6"/><circle cx="62" cy="37" r="6" fill="#ffd23f"/><circle cx="82" cy="37" r="6" fill="#b6ff3b"/>
<text x="500" y="42" text-anchor="middle" class="lbl" fill="#7f8db0">hugo@barcelona: ~/profile</text>
<!-- HUD corners -->
<g stroke="#ff2bd6" stroke-width="3" fill="none" filter="url(#glow)">
<path d="M8 40V8H40"/><path d="M960 8H992V40"/><path d="M8 260V292H40"/><path d="M960 292H992V260"/>
</g>
<g filter="url(#glow)">
<clipPath id="c0"><rect x="48" y="72" height="28" width="0"><animate attributeName="width" values="0;0;100.0;100.0;0;0" keyTimes="0;0.0214;0.0786;0.9571;0.9579;1" dur="14.0s" repeatCount="indefinite"/></rect></clipPath>
<text clip-path="url(#c0)" x="50" y="92" fill="#ff2bd6" font-size="20" class="mono">$ whoami</text>
<clipPath id="c1"><rect x="48" y="102" height="28" width="0"><animate attributeName="width" values="0;0;616.0;616.0;0;0" keyTimes="0;0.0929;0.0936;0.9571;0.9579;1" dur="14.0s" repeatCount="indefinite"/></rect></clipPath>
<text clip-path="url(#c1)" x="50" y="122" fill="#e6f7ff" font-size="20" class="mono">Hugo Rosales Llorente — Computer Engineer (UAB &#x27;26)</text>
<clipPath id="c2"><rect x="48" y="142" height="28" width="0"><animate attributeName="width" values="0;0;184.0;184.0;0;0" keyTimes="0;0.1571;0.2214;0.9571;0.9579;1" dur="14.0s" repeatCount="indefinite"/></rect></clipPath>
<text clip-path="url(#c2)" x="50" y="162" fill="#ff2bd6" font-size="20" class="mono">$ cat focus.txt</text>
<clipPath id="c3"><rect x="48" y="172" height="28" width="0"><animate attributeName="width" values="0;0;664.0;664.0;0;0" keyTimes="0;0.2357;0.2364;0.9571;0.9579;1" dur="14.0s" repeatCount="indefinite"/></rect></clipPath>
<text clip-path="url(#c3)" x="50" y="192" fill="#00f0ff" font-size="20" class="mono">[ AI &amp; Automation ]  [ Data &amp; BI ]  [ IT Project Mgmt ]</text>
<clipPath id="c4"><rect x="48" y="212" height="28" width="0"><animate attributeName="width" values="0;0;208.0;208.0;0;0" keyTimes="0;0.3000;0.3643;0.9571;0.9579;1" dur="14.0s" repeatCount="indefinite"/></rect></clipPath>
<text clip-path="url(#c4)" x="50" y="232" fill="#ff2bd6" font-size="20" class="mono">$ ./run --mission</text>
<clipPath id="c5"><rect x="48" y="244" height="26" width="0"><animate attributeName="width" values="0;0;673.6;673.6;0;0" keyTimes="0;0.3786;0.5643;0.9571;0.9579;1" dur="14.0s" repeatCount="indefinite"/></rect></clipPath>
<text clip-path="url(#c5)" x="50" y="262" fill="#b6ff3b" font-size="18" class="mono">Turning manual processes into automated, data-driven workflows</text>
<rect y="247" width="10" height="18" fill="#b6ff3b">
<animate attributeName="x" values="50;50;723.6;723.6" keyTimes="0;0.3786;0.5643;1" dur="14.0s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3779;0.3786;0.9571;0.9579;1" dur="14.0s" repeatCount="indefinite"/>
</rect>
</g>
<!-- right HUD panel -->
<g transform="translate(0,0)">
<text x="815" y="86" class="lbl" fill="#00f0ff">SYS: <tspan fill="#b6ff3b">ONLINE</tspan><tspan class="blink" fill="#b6ff3b"> ●</tspan></text>
<text x="815" y="106" class="lbl" fill="#00f0ff">LOC: <tspan fill="#e6f7ff">BCN, ES</tspan></text>
<text x="815" y="126" class="lbl" fill="#00f0ff">LANG: <tspan fill="#e6f7ff">CA·ES·EN</tspan></text>
<circle cx="880" cy="205" r="48" fill="none" stroke="#00f0ff" stroke-opacity="0.4"/>
<circle cx="880" cy="205" r="30" fill="none" stroke="#00f0ff" stroke-opacity="0.25"/>
<line x1="832" y1="205" x2="928" y2="205" stroke="#00f0ff" stroke-opacity="0.2"/>
<line x1="880" y1="157" x2="880" y2="253" stroke="#00f0ff" stroke-opacity="0.2"/>
<g class="spin"><path d="M880 205 L880 157 A48 48 0 0 1 921.6 181 Z" fill="url(#beam)"/><line x1="880" y1="205" x2="880" y2="157" stroke="#00f0ff" stroke-width="2"/></g>
<circle cx="902" cy="186" r="3" fill="#ff2bd6"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="862" cy="226" r="3" fill="#b6ff3b"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="2s" repeatCount="indefinite"/></circle>
</g>
<rect width="1000" height="300" fill="url(#scan)"/>
</svg>